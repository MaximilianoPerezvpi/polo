<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POLO</title>
<style>
  :root {
    --bg: #04060c; --bg2: #081020;
    --cyan: #34e6ff; --cyan-dim: #0b6b7a;
    --text: #dbe9ff; --muted: #6b86a8; --user: #16233d;
    --magenta: #ff4fd8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% -5%, var(--bg2), var(--bg));
    color: var(--text); font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    position: relative;
  }
  /* Grilla + scanlines de fondo (decorativas) */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(52,230,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(52,230,255,0.045) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(circle at 50% 30%, #000 40%, transparent 85%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.10) 3px);
  }
  /* Marco HUD con esquinas */
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .hud .corner { position: absolute; width: 34px; height: 34px; border: 2px solid var(--cyan); opacity: 0.55; }
  .hud .corner.tl { top: 12px; left: 12px; border-right: 0; border-bottom: 0; }
  .hud .corner.tr { top: 12px; right: 12px; border-left: 0; border-bottom: 0; }
  .hud .corner.bl { bottom: 12px; left: 12px; border-right: 0; border-top: 0; }
  .hud .corner.br { bottom: 12px; right: 12px; border-left: 0; border-top: 0; }

  .topbar {
    position: relative; z-index: 3; display: flex; justify-content: space-between;
    align-items: center; padding: 18px 34px 6px; font-size: 12px; letter-spacing: 2px;
    color: var(--muted);
  }

  /* Layout de dos columnas: panel HUD + área principal */
  .app { position: relative; z-index: 3; flex: 1; display: flex; min-height: 0; }
  .main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .hud-panel {
    width: 268px; flex: 0 0 268px; padding: 22px 18px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 24px;
    border-right: 1px solid rgba(52,230,255,0.14);
    background: linear-gradient(180deg, rgba(52,230,255,0.04), transparent);
  }
  .panel-label { color: var(--cyan); font-size: 11px; letter-spacing: 3px; margin-bottom: 8px; opacity: 0.85; }
  .panel-date { font-size: 15px; color: var(--text); text-transform: capitalize; }
  .panel-tasks { display: flex; flex-direction: column; gap: 7px; }
  .panel-tasks .item { font-size: 14px; color: var(--text); padding-left: 14px; position: relative; }
  .panel-tasks .item::before { content: "▸"; color: var(--cyan); position: absolute; left: 0; }
  .panel-muted { color: var(--muted); font-size: 13px; font-style: italic; }
  .panel-weather .temp { font-size: 26px; color: var(--cyan); font-weight: 300; }
  .panel-weather .desc { font-size: 13px; color: var(--muted); text-transform: capitalize; }
  .panel-foot { margin-top: auto; color: var(--muted); font-size: 10px; letter-spacing: 2px; opacity: 0.6; }
  @media (max-width: 860px) { .hud-panel { display: none; } }
  .topbar .status { color: var(--cyan); }
  .topbar .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 8px var(--cyan); margin-right: 6px; animation: blink 2s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .stage { position: relative; z-index: 3; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 14px 0 2px; }
  .core { position: relative; width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; }
  #sphere { position: absolute; inset: 0; }
  .core .ring { position: absolute; border-radius: 50%; border: 1px solid var(--cyan-dim); width: 240px; height: 240px; opacity: 0.35; animation: spin 14s linear infinite; }
  .core .ring:nth-child(3) { width: 200px; height: 200px; border-color: var(--cyan); opacity: 0.25; animation-duration: 9s; animation-direction: reverse; border-style: dashed; }
  .core .orb {
    position: absolute; width: 66px; height: 66px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #bff6ff, var(--cyan) 45%, #0a2a44 100%);
    box-shadow: 0 0 34px 8px rgba(52,230,255,0.5), inset 0 0 18px rgba(255,255,255,0.4);
    animation: pulse 3.4s ease-in-out infinite; transition: background .3s;
  }
  body.thinking .core .orb { animation-duration: 0.9s; box-shadow: 0 0 48px 12px rgba(52,230,255,0.8), inset 0 0 18px rgba(255,255,255,0.55); }
  body.speaking .core .orb { animation-duration: 0.5s; box-shadow: 0 0 60px 16px rgba(52,230,255,0.95), inset 0 0 22px rgba(255,255,255,0.65); }
  body.listening .core .orb { background: radial-gradient(circle at 35% 30%, #ffd4f6, var(--magenta) 45%, #3a0a30 100%); box-shadow: 0 0 55px 14px rgba(255,79,216,0.85), inset 0 0 22px rgba(255,255,255,0.6); animation-duration: 0.7s; }
  body.listening .core .ring { border-color: var(--magenta); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.09); filter: brightness(1.3); } }

  .title { position: relative; z-index: 3; text-align: center; letter-spacing: 12px; font-weight: 300; font-size: 24px; color: var(--cyan); margin-top: 6px; text-shadow: 0 0 16px rgba(52,230,255,0.55); }
  .subtitle { position: relative; z-index: 3; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: 3px; margin-top: 3px; height: 15px; text-transform: uppercase; }

  .chat { position: relative; z-index: 3; flex: 1 1 auto; overflow-y: auto; padding: 14px 16px; margin: 8px auto 0; width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 11px 15px; border-radius: 12px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); border: 1px solid #2c3f5f; border-bottom-right-radius: 3px; }
  .msg.polo { align-self: flex-start; background: linear-gradient(180deg, rgba(52,230,255,0.10), rgba(52,230,255,0.03)); border: 1px solid var(--cyan-dim); border-bottom-left-radius: 3px; box-shadow: 0 0 18px rgba(52,230,255,0.08); }
  .msg.error { align-self: flex-start; background: rgba(255,80,80,0.08); border: 1px solid #7a2b2b; color: #ffb4b4; }
  .typing { color: var(--muted); font-style: italic; }

  .bar { position: relative; z-index: 3; flex: 0 0 auto; padding: 12px 16px 20px; display: flex; gap: 10px; width: 100%; max-width: 760px; margin: 0 auto; align-items: center; }
  .bar input { flex: 1; background: rgba(255,255,255,0.04); color: var(--text); border: 1px solid #223452; border-radius: 10px; padding: 13px 16px; font-size: 15px; outline: none; transition: border-color .2s, box-shadow .2s; }
  .bar input:focus { border-color: var(--cyan); box-shadow: 0 0 14px rgba(52,230,255,0.25); }
  .iconbtn { background: rgba(255,255,255,0.05); color: var(--cyan); border: 1px solid #223452; border-radius: 10px; width: 48px; height: 48px; font-size: 20px; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; }
  .iconbtn:hover { border-color: var(--cyan); box-shadow: 0 0 14px rgba(52,230,255,0.3); }
  .iconbtn.active { background: var(--cyan); color: #04121a; }
  .iconbtn.mic.on { background: var(--magenta); color: #fff; border-color: var(--magenta); box-shadow: 0 0 18px rgba(255,79,216,0.6); }
  .bar button.send { background: var(--cyan); color: #04121a; border: none; border-radius: 10px; padding: 0 22px; height: 48px; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform .1s, box-shadow .2s; }
  .bar button.send:hover { box-shadow: 0 0 18px rgba(52,230,255,0.5); }
  .bar button.send:active { transform: scale(0.96); }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: #1c2b45; border-radius: 8px; }
</style>
</head>
<body>
  <div class="hud">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>

  <div class="app">
    <aside class="hud-panel" id="hudPanel">
      <div class="panel-block">
        <div class="panel-label">FECHA</div>
        <div class="panel-date" id="panelDate">—</div>
      </div>
      <div class="panel-block">
        <div class="panel-label">PENDIENTES</div>
        <div id="panelTasks" class="panel-tasks"><span class="panel-muted">cargando...</span></div>
      </div>
      <div class="panel-block" id="panelWeatherBlock" style="display:none">
        <div class="panel-label">CLIMA</div>
        <div id="panelWeather" class="panel-weather"></div>
      </div>
      <div class="panel-foot">POLO // núcleo neuronal</div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="status"><span class="dot"></span>SISTEMA EN LÍNEA</div>
        <div id="clock">--:--:--</div>
      </div>

      <div class="stage">
        <div class="core">
          <canvas id="sphere"></canvas>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="orb"></div>
        </div>
      </div>
      <div class="title">P O L O</div>
      <div class="subtitle" id="subtitle">asistente en línea</div>

      <div class="chat" id="chat"></div>

      <div class="bar">
        <button class="iconbtn active" id="voiceToggle" title="Voz de POLO">🔊</button>
        <button class="iconbtn mic" id="mic" title="Hablarle a POLO">🎤</button>
        <input id="input" type="text" placeholder="Escribí o tocá el micrófono..." autocomplete="off" />
        <button class="send" id="send">Enviar</button>
      </div>
    </div>
  </div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const mic = document.getElementById("mic");
  const voiceToggle = document.getElementById("voiceToggle");
  const subtitle = document.getElementById("subtitle");
  const body = document.body;

  let voiceOn = true;
  let vozEs = null;

  // ── Reloj en vivo (HUD) ────────────────────────────────────
  const clock = document.getElementById("clock");
  function tick() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    clock.textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  tick(); setInterval(tick, 1000);

  // ── Panel HUD: fecha, pendientes, clima ────────────────────
  const panelDate = document.getElementById("panelDate");
  const panelTasks = document.getElementById("panelTasks");
  const panelWeather = document.getElementById("panelWeather");
  const panelWeatherBlock = document.getElementById("panelWeatherBlock");

  function actualizarFecha() {
    const d = new Date();
    panelDate.textContent = d.toLocaleDateString("es-ES", {
      weekday: "long", day: "numeric", month: "long",
    });
  }
  actualizarFecha();

  async function cargarDashboard() {
    try {
      const r = await fetch("/api/dashboard");
      const data = await r.json();
      // Pendientes
      if (data.tasks && data.tasks.length) {
        panelTasks.innerHTML = "";
        data.tasks.slice(0, 8).forEach((t) => {
          const div = document.createElement("div");
          div.className = "item"; div.textContent = t;
          panelTasks.appendChild(div);
        });
      } else {
        panelTasks.innerHTML = '<span class="panel-muted">sin pendientes 🎉</span>';
      }
      // Clima
      if (data.weather) {
        panelWeatherBlock.style.display = "block";
        panelWeather.innerHTML =
          '<div class="temp">' + Math.round(data.weather.temp) + "°</div>" +
          '<div class="desc">' + data.weather.desc + " · " + data.weather.lugar + "</div>";
      } else {
        panelWeatherBlock.style.display = "none";
      }
    } catch (e) {
      panelTasks.innerHTML = '<span class="panel-muted">—</span>';
    }
  }
  cargarDashboard();
  setInterval(cargarDashboard, 60000);

  // ── Esfera de partículas (núcleo tipo radar) ───────────────
  const canvas = document.getElementById("sphere");
  const ctx = canvas.getContext("2d");
  const SIZE = 240; canvas.width = SIZE; canvas.height = SIZE;
  const pts = [];
  const N = 300;
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const theta = i * 2.399963;
    pts.push({ x: Math.cos(theta) * r, y: y, z: Math.sin(theta) * r });
  }
  let ang = 0;
  function drawSphere() {
    ctx.clearRect(0, 0, SIZE, SIZE);
    const activo = body.classList.contains("thinking") || body.classList.contains("speaking");
    const listening = body.classList.contains("listening");
    ang += activo ? 0.032 : 0.008;
    const color = listening ? "255,79,216" : "52,230,255";
    const cx = SIZE / 2, cy = SIZE / 2, R = SIZE * 0.42;
    const cos = Math.cos(ang), sin = Math.sin(ang);
    for (const p of pts) {
      const x = p.x * cos - p.z * sin;
      const z = p.x * sin + p.z * cos;
      const scale = (z + 1.6) / 2.6;
      const sx = cx + x * R;
      const sy = cy + p.y * R;
      ctx.beginPath();
      ctx.arc(sx, sy, 1.5 * scale, 0, 6.2832);
      ctx.fillStyle = "rgba(" + color + "," + (0.2 + 0.6 * scale) + ")";
      ctx.fill();
    }
    requestAnimationFrame(drawSphere);
  }
  drawSphere();

  // ── Voz de salida (el navegador habla) ─────────────────────
  function cargarVoz() {
    const voces = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    vozEs = voces.find(v => /es[-_]/i.test(v.lang)) || voces[0] || null;
  }
  if (window.speechSynthesis) {
    cargarVoz();
    speechSynthesis.onvoiceschanged = cargarVoz;
  } else {
    voiceToggle.style.display = "none";
  }

  function hablar(texto) {
    if (!voiceOn || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    if (vozEs) u.voice = vozEs;
    u.lang = "es-ES"; u.rate = 1.02;
    u.onstart = () => { body.classList.add("speaking"); subtitle.textContent = "hablando..."; };
    u.onend = () => { body.classList.remove("speaking"); subtitle.textContent = "asistente en línea"; };
    speechSynthesis.speak(u);
  }

  let audioActual = null;
  function reproducirAudio(dataUrl) {
    if (!voiceOn) return;
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (audioActual) { audioActual.pause(); audioActual = null; }
    const audio = new Audio(dataUrl);
    audioActual = audio;
    audio.onplay = () => { body.classList.add("speaking"); subtitle.textContent = "hablando..."; };
    const fin = () => { body.classList.remove("speaking"); subtitle.textContent = "asistente en línea"; };
    audio.onended = fin;
    audio.onerror = fin;
    audio.play().catch(() => { fin(); });
  }

  voiceToggle.addEventListener("click", () => {
    voiceOn = !voiceOn;
    voiceToggle.classList.toggle("active", voiceOn);
    voiceToggle.textContent = voiceOn ? "🔊" : "🔇";
    if (!voiceOn && window.speechSynthesis) speechSynthesis.cancel();
  });

  // ── Voz de entrada (el navegador escucha) ──────────────────
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recog = null, escuchando = false;
  if (SR) {
    recog = new SR();
    recog.lang = "es-ES"; recog.interimResults = false; recog.maxAlternatives = 1;
    recog.onstart = () => { escuchando = true; mic.classList.add("on"); body.classList.add("listening"); subtitle.textContent = "escuchando..."; };
    recog.onend = () => { escuchando = false; mic.classList.remove("on"); body.classList.remove("listening"); if (subtitle.textContent === "escuchando...") subtitle.textContent = "asistente en línea"; };
    recog.onresult = (e) => { const texto = e.results[0][0].transcript; input.value = texto; enviar(); };
    recog.onerror = () => { subtitle.textContent = "no te escuché"; setTimeout(() => subtitle.textContent = "asistente en línea", 1500); };
  } else {
    mic.style.display = "none";
  }
  mic.addEventListener("click", () => {
    if (!recog) return;
    if (escuchando) { recog.stop(); } else { try { recog.start(); } catch (e) {} }
  });

  // ── Chat ───────────────────────────────────────────────────
  function addMsg(texto, clase) {
    const div = document.createElement("div");
    div.className = "msg " + clase; div.textContent = texto;
    chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function enviar() {
    const texto = input.value.trim();
    if (!texto) return;
    input.value = "";
    addMsg(texto, "user");
    body.classList.add("thinking");
    subtitle.textContent = "procesando...";
    send.disabled = true;
    const typing = addMsg("POLO está pensando...", "polo typing");

    try {
      const resp = await fetch("/api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: texto })
      });
      const data = await resp.json();
      typing.remove();
      body.classList.remove("thinking");
      if (data.error) {
        addMsg(data.error, "error");
        subtitle.textContent = "asistente en línea";
      } else {
        addMsg(data.text, "polo");
        if (data.audio) {
          reproducirAudio(data.audio);
        } else {
          hablar(data.text);
        }
        if (!voiceOn) subtitle.textContent = "asistente en línea";
      }
    } catch (e) {
      typing.remove();
      body.classList.remove("thinking");
      addMsg("No pude conectar con POLO. ¿Sigue corriendo el servidor?", "error");
      subtitle.textContent = "asistente en línea";
    } finally {
      send.disabled = false;
      input.focus();
      cargarDashboard();
    }
  }

  send.addEventListener("click", enviar);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") enviar(); });
  input.focus();
  addMsg("Hola, soy POLO. ¿En qué te ayudo?", "polo");
</script>
</body>
</html>
