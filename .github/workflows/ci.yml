name: CI

# Corre en cada push a main y en cada pull request.
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: polo

jobs:
  quality:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        # Mismos extras que en desarrollo local (ver README): cloud (NIM),
        # gui (FastAPI, para interfaces/web/), nimvoice (Magpie TTS) y
        # spotify. El grupo dev (ruff, mypy, pytest) se instala por defecto.
        run: uv sync --extra cloud --extra gui --extra nimvoice --extra spotify

      - name: Ruff (linter)
        run: uv run ruff check .

      - name: Ruff (formato)
        run: uv run ruff format --check .

      - name: Mypy (tipos estrictos)
        run: uv run mypy

      - name: Pytest (tests)
        run: uv run pytest -q
